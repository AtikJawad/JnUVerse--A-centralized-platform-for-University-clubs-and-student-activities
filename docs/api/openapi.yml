components:
  schemas:
    AudienceEnum:
      enum:
      - public
      - followers
      - members
      - department
      type: string
      description: |-
        * `public` - Public
        * `followers` - Followers
        * `members` - Members
        * `department` - Department
    BlankEnum:
      enum:
      - ''
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 170
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        logo:
          type: string
          format: uri
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 254
        is_verified:
          type: boolean
          readOnly: true
      required:
      - id
      - is_verified
      - name
    ClubCounts:
      type: object
      properties:
        followers:
          type: integer
        members:
          type: integer
        pending_membership_requests:
          type: integer
        upcoming_events:
          type: integer
        draft_events:
          type: integer
        pending_collaboration_requests:
          type: integer
        unread_notifications:
          type: integer
      required:
      - draft_events
      - followers
      - members
      - pending_collaboration_requests
      - pending_membership_requests
      - unread_notifications
      - upcoming_events
