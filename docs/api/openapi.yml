openapi: 3.0.3
info:
  title: JnUVerse API
  version: 0.2.0
  description: Backend API for JnUVerse (JnU clubs & student activities).
paths:
  /api/auth/departments/:
    get:
      operationId: api_auth_departments_retrieve
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
          description: ''
  /api/auth/interests/:
    get:
      operationId: api_auth_interests_retrieve
      description: 'Public: the fixed list of interests to choose from.'
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestList'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
  /api/auth/me/interests/:
    get:
      operationId: api_auth_me_interests_retrieve
      description: 'A student''s own interests: read, or replace the whole selection.'
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestList'
          description: ''
    put:
      operationId: api_auth_me_interests_update
      description: 'A student''s own interests: read, or replace the whole selection.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestIds'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterestIds'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterestIds'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestList'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/club/:
    post:
      operationId: api_auth_register_club_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClubRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClubRegistration'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubRegistrationResponse'
          description: ''
  /api/auth/register/student/:
    post:
      operationId: api_auth_register_student_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/clubs/:
    get:
      operationId: api_clubs_list
      parameters:
      - in: query
        name: following
        schema:
          type: boolean
        description: 'Students only: clubs the student follows'
      - in: query
        name: joined
        schema:
          type: boolean
        description: 'Students only: clubs the student is an approved member of'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubPublicList'
          description: ''
  /api/clubs/{slug}/:
    get:
      operationId: api_clubs_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubPublic'
          description: ''
    patch:
      operationId: api_clubs_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClubUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClubUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClubUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubUpdate'
          description: ''
  /api/clubs/{slug}/follow/:
    post:
      operationId: api_clubs_follow_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowState'
          description: ''
    delete:
      operationId: api_clubs_follow_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/clubs/{slug}/members/:
    get:
      operationId: api_clubs_members_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
  /api/clubs/{slug}/membership/:
    get:
      operationId: api_clubs_membership_retrieve
      description: 'Student''s own membership with a club: request / status / leave.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipState'
          description: ''
    post:
      operationId: api_clubs_membership_create
      description: 'Student''s own membership with a club: request / status / leave.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipStateExisting'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipStateRequested'
          description: ''
    delete:
      operationId: api_clubs_membership_destroy
      description: 'Student''s own membership with a club: request / status / leave.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/clubs/{slug}/membership-requests/:
    get:
      operationId: api_clubs_membership_requests_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
  /api/clubs/{slug}/memberships/{id}/:
    delete:
      operationId: api_clubs_memberships_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/clubs/{slug}/memberships/{id}/approve/:
    post:
      operationId: api_clubs_memberships_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/clubs/{slug}/memberships/{id}/reject/:
    post:
      operationId: api_clubs_memberships_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/clubs/{slug}/partners/:
    get:
      operationId: api_clubs_partners_list
      description: 'Public: clubs with at least one accepted collaboration with this
        club.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPartnerList'
          description: ''
  /api/collaborations/:
    get:
      operationId: api_collaborations_list
      parameters:
      - in: query
        name: box
        schema:
          type: string
          enum:
          - received
          - sent
        description: 'Only sent or only received requests (default: both).'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted
          - cancelled
          - pending
          - rejected
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollaborationList'
          description: ''
    post:
      operationId: api_collaborations_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollaborationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollaborationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollaborationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'
          description: ''
  /api/collaborations/{id}/:
    get:
      operationId: api_collaborations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'
          description: ''
  /api/collaborations/{id}/accept/:
    post:
      operationId: api_collaborations_accept_create
      description: Accept / reject (target club) or cancel (requesting club), pending
        requests only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'
          description: ''
  /api/collaborations/{id}/cancel/:
    post:
      operationId: api_collaborations_cancel_create
      description: Accept / reject (target club) or cancel (requesting club), pending
        requests only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'
          description: ''
  /api/collaborations/{id}/reject/:
    post:
      operationId: api_collaborations_reject_create
      description: Accept / reject (target club) or cancel (requesting club), pending
        requests only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'
          description: ''
  /api/dashboard/club/:
    get:
      operationId: api_dashboard_club_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDashboard'
          description: ''
  /api/dashboard/student/:
    get:
      operationId: api_dashboard_student_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDashboard'
          description: ''
  /api/events/:
    get:
      operationId: api_events_list
      parameters:
      - in: query
        name: club
        schema:
          type: string
        description: Club slug
      - in: query
        name: mine
        schema:
          type: boolean
        description: 'Club operators only: own club''s events incl. drafts'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: registered
        schema:
          type: boolean
        description: 'Students only: events the student is registered for'
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: upcoming
        schema:
          type: boolean
        description: 'true: not yet ended (soonest first); false: past (latest first)'
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: api_events_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/{id}/:
    get:
      operationId: api_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: api_events_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/{id}/cancel/:
    post:
      operationId: api_events_cancel_create
      description: Publish / cancel. Visibility first (404 for others' drafts), then
        ownership (403).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/{id}/publish/:
    post:
      operationId: api_events_publish_create
      description: Publish / cancel. Visibility first (404 for others' drafts), then
        ownership (403).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/{id}/rating/:
    get:
      operationId: api_events_rating_retrieve
      description: A student's own rating of an event (1-5, no comments).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRating'
          description: ''
    put:
      operationId: api_events_rating_update
      description: A student's own rating of an event (1-5, no comments).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RatingInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RatingInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/{id}/rating-summary/:
    get:
      operationId: api_events_rating_summary_retrieve
      description: 'Operator of the owning club: average, count and 1-5 breakdown
        (never individual ratings).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummary'
          description: ''
  /api/events/{id}/register/:
    post:
      operationId: api_events_register_create
      description: 'A student''s own registration: register (POST) / cancel (DELETE).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: api_events_register_destroy
      description: 'A student''s own registration: register (POST) / cancel (DELETE).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{id}/registrations/:
    get:
      operationId: api_events_registrations_list
      description: 'Operator of the owning club: students currently registered (no
        emails).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
