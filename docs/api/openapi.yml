openapi: 3.0.3
info:
  title: JnUVerse API
  version: 0.2.0
  description: Backend API for JnUVerse (JnU clubs & student activities).
paths:
  /api/auth/departments/:
    get:
      operationId: api_auth_departments_retrieve
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/club/:
    post:
      operationId: api_auth_register_club_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClubRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClubRegistration'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubRegistrationResponse'
          description: ''
  /api/auth/register/student/:
    post:
      operationId: api_auth_register_student_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/clubs/:
    get:
      operationId: api_clubs_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubPublicList'
          description: ''
  /api/clubs/{slug}/:
    get:
      operationId: api_clubs_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubPublic'
          description: ''
    patch:
      operationId: api_clubs_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClubUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClubUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClubUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubUpdate'
          description: ''
  /api/clubs/{slug}/follow/:
    post:
      operationId: api_clubs_follow_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowState'
          description: ''
    delete:
      operationId: api_clubs_follow_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/clubs/{slug}/members/:
    get:
      operationId: api_clubs_members_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
  /api/clubs/{slug}/membership/:
    get:
      operationId: api_clubs_membership_retrieve
      description: 'Student''s own membership with a club: request / status / leave.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipState'
          description: ''
    post:
      operationId: api_clubs_membership_create
      description: 'Student''s own membership with a club: request / status / leave.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipStateExisting'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipStateRequested'
          description: ''
    delete:
      operationId: api_clubs_membership_destroy
      description: 'Student''s own membership with a club: request / status / leave.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/clubs/{slug}/membership-requests/:
    get:
      operationId: api_clubs_membership_requests_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
  /api/clubs/{slug}/memberships/{id}/:
    delete:
      operationId: api_clubs_memberships_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/clubs/{slug}/memberships/{id}/approve/:
    post:
      operationId: api_clubs_memberships_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/clubs/{slug}/memberships/{id}/reject/:
    post:
      operationId: api_clubs_memberships_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
components:
  schemas:
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 170
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        logo:
          type: string
          format: uri
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 254
        is_verified:
          type: boolean
          readOnly: true
      required:
      - id
      - is_verified
      - name
    ClubPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 170
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        logo:
          type: string
          format: uri
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 254
        is_verified:
          type: boolean
          readOnly: true
        follower_count:
          type: integer
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        is_following:
          type: boolean
          readOnly: true
          nullable: true
        my_membership:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - follower_count
      - id
      - is_following
      - is_verified
      - member_count
      - my_membership
      - name
    ClubRegistration:
      type: object
      properties:
        club_name:
          type: string
          maxLength: 150
        description:
          type: string
          default: ''
        contact_email:
          type: string
          format: email
          default: ''
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
      required:
      - club_name
      - email
      - password
      - password_confirm
    ClubRegistrationResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        club:
          $ref: '#/components/schemas/Club'
      required:
      - club
      - user
    ClubUpdate:
      type: object
      properties:
        description:
          type: string
        logo:
          type: string
          format: uri
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 254
    DepartmentEnum:
      enum:
      - Bangla
      - English
      - History
      - Philosophy
      - Islamic History and Culture
      - Islamic Studies
      - Music
      - Drama
      - Chemistry
      - Mathematics
      - Physics
      - Statistics
      - Computer Science and Engineering (CSE)
      - Accounting and Information Systems (AIS)
      - Management Studies
      - Finance
      - Marketing
      - Economics
      - Political Science
      - Sociology
      - Social Work
      - Anthropology
      - Mass Communication and Journalism
      - Public Administration
      - Film and Television
      - Botany
      - Zoology
      - Geography & Environment
      - Psychology
      - Microbiology
      - Biochemistry and Molecular Biology
      - Genetic Engineering and Biotechnology
      - Pharmacy
      - Law
      - Land Management & Law
      - Fine Arts
      - Institute of Education and Research (IER)
      - Institute of Modern Languages (IML)
      type: string
      description: |-
        * `Bangla` - Bangla
        * `English` - English
        * `History` - History
        * `Philosophy` - Philosophy
        * `Islamic History and Culture` - Islamic History and Culture
        * `Islamic Studies` - Islamic Studies
        * `Music` - Music
        * `Drama` - Drama
        * `Chemistry` - Chemistry
        * `Mathematics` - Mathematics
        * `Physics` - Physics
        * `Statistics` - Statistics
        * `Computer Science and Engineering (CSE)` - Computer Science and Engineering (CSE)
        * `Accounting and Information Systems (AIS)` - Accounting and Information Systems (AIS)
        * `Management Studies` - Management Studies
        * `Finance` - Finance
        * `Marketing` - Marketing
        * `Economics` - Economics
        * `Political Science` - Political Science
        * `Sociology` - Sociology
        * `Social Work` - Social Work
        * `Anthropology` - Anthropology
        * `Mass Communication and Journalism` - Mass Communication and Journalism
        * `Public Administration` - Public Administration
        * `Film and Television` - Film and Television
        * `Botany` - Botany
        * `Zoology` - Zoology
        * `Geography & Environment` - Geography & Environment
        * `Psychology` - Psychology
        * `Microbiology` - Microbiology
        * `Biochemistry and Molecular Biology` - Biochemistry and Molecular Biology
        * `Genetic Engineering and Biotechnology` - Genetic Engineering and Biotechnology
        * `Pharmacy` - Pharmacy
        * `Law` - Law
        * `Land Management & Law` - Land Management & Law
        * `Fine Arts` - Fine Arts
        * `Institute of Education and Research (IER)` - Institute of Education and Research (IER)
        * `Institute of Modern Languages (IML)` - Institute of Modern Languages (IML)
    DepartmentList:
      type: object
      properties:
        departments:
          type: array
          items:
            type: string
      required:
      - departments
    FollowState:
      type: object
      properties:
        following:
          type: boolean
        follower_count:
          type: integer
      required:
      - follower_count
      - following
    Login:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - identifier
      - password
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        student_id:
          type: string
          nullable: true
        name:
          type: string
        department:
          type: string
          nullable: true
        batch:
          type: integer
          nullable: true
        role:
          type: string
        club:
          $ref: '#/components/schemas/Club'
      required:
      - batch
      - department
      - email
      - id
      - name
      - role
      - student_id
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        department:
          type: string
          readOnly: true
        batch:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        requested_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - batch
      - department
      - id
      - name
      - student_id
    MembershipState:
      type: object
      properties:
        status:
          type: string
          nullable: true
        requested_at:
          type: string
          format: date-time
          nullable: true
      required:
      - requested_at
      - status
    MembershipStateExisting:
      type: object
      properties:
        status:
          type: string
        requested_at:
          type: string
          format: date-time
      required:
      - requested_at
      - status
    MembershipStateRequested:
      type: object
      properties:
        status:
          type: string
        requested_at:
          type: string
          format: date-time
      required:
      - requested_at
      - status
    PaginatedClubPublicList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClubPublic'
    PaginatedMembershipList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    PatchedClubUpdate:
      type: object
      properties:
        description:
          type: string
        logo:
          type: string
          format: uri
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 254
    RoleEnum:
      enum:
      - student
      - club_operator
      type: string
      description: |-
        * `student` - Student
        * `club_operator` - Club Operator
    StatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - left
      - removed
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `left` - Left
        * `removed` - Removed
    StudentRegistration:
      type: object
      properties:
        student_id:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        department:
          $ref: '#/components/schemas/DepartmentEnum'
        batch:
          type: integer
          minimum: 1
        password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
      required:
      - batch
      - department
      - email
      - password
      - password_confirm
      - student_id
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        student_id:
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
          readOnly: true
        department:
          type: string
          nullable: true
          readOnly: true
        batch:
          type: integer
          nullable: true
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - batch
      - department
      - email
      - id
      - name
      - student_id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
